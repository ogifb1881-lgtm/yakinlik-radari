name: Build iOS IPA (Sideloadly)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ios_app
        run: xcodegen generate

      - name: Build Unsigned iOS App
        working-directory: ios_app
        run: |
          xcodebuild build \
            -project YakinlikRadari.xcodeproj \
            -target YakinlikRadari \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA for Sideloadly
        working-directory: ios_app
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "YakinlikRadari.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r YakinlikRadari_iOS.ipa Payload

      - name: Upload YakinlikRadari_iOS.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YakinlikRadari_iOS_IPA
          path: ios_app/YakinlikRadari_iOS.ipa
