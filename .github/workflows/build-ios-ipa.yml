name: Build iOS IPA (Sideloadly)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile and Package iOS App Directly
        working-directory: ios_app
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p Payload/YakinlikRadari.app

          echo "Compiling Swift sources for arm64-apple-ios15.0..."
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios15.0 \
            -sdk "$SDK_PATH" \
            -O \
            Sources/BluetoothRadarManager.swift \
            Sources/YakinlikRadariApp.swift \
            -o Payload/YakinlikRadari.app/YakinlikRadari

          cp Info.plist Payload/YakinlikRadari.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable YakinlikRadari" Payload/YakinlikRadari.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.example.yakinlikradari.ios" Payload/YakinlikRadari.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName YakinlikRadari" Payload/YakinlikRadari.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 15.0" Payload/YakinlikRadari.app/Info.plist || true

          chmod +x Payload/YakinlikRadari.app/YakinlikRadari
          codesign --force --sign - --timestamp=none Payload/YakinlikRadari.app
          zip -r YakinlikRadari_iOS.ipa Payload

      - name: Upload YakinlikRadari_iOS.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YakinlikRadari_iOS_IPA
          path: ios_app/YakinlikRadari_iOS.ipa
