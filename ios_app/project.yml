name: YakinlikRadari
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
targets:
  YakinlikRadari:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Yakınlık Radarı
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: ""
        NSBluetoothAlwaysUsageDescription: "Eklediğiniz kişilerin Bluetooth sinyal mesafesini ölçmek ve yaklaştıklarında bildirim vermek için Bluetooth izni gereklidir."
        NSBluetoothPeripheralUsageDescription: "Yakındaki Bluetooth cihazlarını algılamak için izin gereklidir."
        UIBackgroundModes:
          - bluetooth-central
          - fetch
          - processing
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.yakinlikradari.ios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
